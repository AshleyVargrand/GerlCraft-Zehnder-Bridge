# Zehnder ComfoAir Bridge - animiertes Home-Assistant-Dashboard
# Voraussetzung: button-card aus HACS (custom-cards/button-card)
# Erwarteter Entity-Praefix: zehnder_comfoair_q350

title: Zehnder ComfoAir

button_card_templates:
  zehnder_hero:
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    hold_action:
      action: none
    rotate: |
      [[[
        return states['binary_sensor.zehnder_comfoair_q350_verbindung']?.state === 'on';
      ]]]
    name: Zehnder ComfoAir Q
    state_display: |
      [[[
        return `Lüfterstufe ${entity?.state ?? '–'}`;
      ]]]
    label: |
      [[[
        const mode = states['sensor.zehnder_comfoair_q350_betriebsmodus']?.state ?? '–';
        return mode;
      ]]]
    custom_fields:
      airflow: |
        [[[
          const supply = states['sensor.zehnder_comfoair_q350_zuluftvolumenstrom']?.state ?? '–';
          const exhaust = states['sensor.zehnder_comfoair_q350_abluftvolumenstrom']?.state ?? '–';
          return `<span class="metric-value">${supply}</span> / ${exhaust} m³/h`;
        ]]]
      temperature: |
        [[[
          const outdoor = states['sensor.zehnder_comfoair_q350_aussenlufttemperatur']?.state ?? '–';
          const supply = states['sensor.zehnder_comfoair_q350_zulufttemperatur']?.state ?? '–';
          return `<span class="metric-value">${outdoor}</span> / ${supply} °C`;
        ]]]
      power: |
        [[[
          const value = states['sensor.zehnder_comfoair_q350_leistungsaufnahme']?.state ?? '–';
          return `<span class="metric-value">${value}</span> W`;
        ]]]
    styles:
      card:
        - min-height: 190px
        - border-radius: 8px
        - padding: 22px
        - background: linear-gradient(135deg, rgba(0, 137, 123, 0.22), rgba(3, 169, 244, 0.10))
        - border: 1px solid rgba(0, 137, 123, 0.35)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n n" "i s l" "i airflow temperature" "i power power"'
        - grid-template-columns: 92px 1fr 1fr
        - grid-template-rows: min-content min-content 1fr min-content
        - column-gap: 16px
      icon:
        - width: 68px
        - color: var(--teal-color)
      img_cell:
        - align-self: center
        - justify-self: center
        - width: 82px
        - height: 82px
        - border-radius: 50%
        - background: rgba(0, 137, 123, 0.14)
      name:
        - justify-self: start
        - align-self: end
        - font-size: 22px
        - font-weight: 600
        - letter-spacing: 0
      state:
        - justify-self: start
        - font-size: 16px
        - font-weight: 600
        - color: var(--primary-text-color)
      label:
        - justify-self: end
        - font-size: 14px
        - color: var(--secondary-text-color)
      custom_fields:
        airflow:
          - justify-self: start
          - align-self: end
          - color: var(--secondary-text-color)
          - font-size: 14px
        temperature:
          - justify-self: end
          - align-self: end
          - color: var(--secondary-text-color)
          - font-size: 14px
        power:
          - justify-self: start
          - color: var(--secondary-text-color)
          - font-size: 14px
    extra_styles: |
      .metric-value {
        color: var(--primary-text-color);
        font-weight: 700;
      }

  zehnder_status:
    show_state: true
    show_label: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      card:
        - min-height: 112px
        - border-radius: 8px
        - padding: 16px
        - box-shadow: none
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 42px min-content min-content
      icon:
        - width: 34px
      name:
        - justify-self: center
        - font-size: 13px
        - color: var(--secondary-text-color)
        - letter-spacing: 0
      state:
        - justify-self: center
        - font-size: 15px
        - font-weight: 600
        - letter-spacing: 0

views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:air-filter
    show_icon_and_title: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Anlage
        cards:
          - type: custom:button-card
            entity: sensor.zehnder_comfoair_q350_lufterstufe
            icon: mdi:fan
            name: Zehnder ComfoAir Q
            show_icon: true
            show_name: true
            show_state: true
            show_label: true
            tap_action:
              action: more-info
            hold_action:
              action: none
            rotate: |
              [[[
                return states['binary_sensor.zehnder_comfoair_q350_verbindung']?.state === 'on';
              ]]]
            state_display: |
              [[[
                return `Lüfterstufe ${entity?.state ?? '–'}`;
              ]]]
            label: |
              [[[
                return states['sensor.zehnder_comfoair_q350_betriebsmodus']?.state ?? '–';
              ]]]
            custom_fields:
              airflow: |
                [[[
                  const supply = states['sensor.zehnder_comfoair_q350_zuluftvolumenstrom']?.state ?? '–';
                  const exhaust = states['sensor.zehnder_comfoair_q350_abluftvolumenstrom']?.state ?? '–';
                  return `${supply} / ${exhaust} m³/h`;
                ]]]
              temperature: |
                [[[
                  const outdoor = states['sensor.zehnder_comfoair_q350_aussenlufttemperatur']?.state ?? '–';
                  const supply = states['sensor.zehnder_comfoair_q350_zulufttemperatur']?.state ?? '–';
                  return `${outdoor} / ${supply} °C`;
                ]]]
            grid_options:
              columns: 12
              rows: 4
            styles:
              card:
                - height: 100%
                - border-radius: 8px
                - padding: 18px
                - background: linear-gradient(135deg, rgba(0, 137, 123, 0.22), rgba(3, 169, 244, 0.10))
                - border: 1px solid rgba(0, 137, 123, 0.35)
                - box-shadow: none
              grid:
                - grid-template-areas: '"i n l" "i s s" "i airflow airflow" "i temperature temperature"'
                - grid-template-columns: 72px 1fr min-content
                - grid-template-rows: min-content min-content min-content min-content
                - column-gap: 14px
              icon:
                - width: 54px
                - color: var(--teal-color)
              img_cell:
                - align-self: center
                - justify-self: center
                - width: 66px
                - height: 66px
                - border-radius: 50%
                - background: rgba(0, 137, 123, 0.14)
              name:
                - justify-self: start
                - font-size: 18px
                - font-weight: 600
                - letter-spacing: 0
              state:
                - justify-self: start
                - font-size: 15px
                - font-weight: 600
                - color: var(--primary-text-color)
              label:
                - justify-self: end
                - font-size: 13px
                - color: var(--secondary-text-color)
              custom_fields:
                airflow:
                  - justify-self: start
                  - color: var(--secondary-text-color)
                  - font-size: 13px
                temperature:
                  - justify-self: start
                  - color: var(--secondary-text-color)
                  - font-size: 13px

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bridge_gesundheit
            name: Bridge
            icon: mdi:heart-pulse
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterstatus
            name: Filter
            icon: mdi:air-filter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: custom:button-card
            entity: binary_sensor.zehnder_comfoair_q350_freie_kuhlung
            name: Freie Kühlung
            icon: mdi:snowflake-thermometer
            show_state: true
            tap_action:
              action: more-info
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
            styles:
              card:
                - height: 100%
                - border-radius: 8px
                - padding: 12px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: 38px 1fr
                - grid-template-rows: 1fr 1fr
              icon:
                - width: 28px
                - color: |
                    [[[
                      return entity?.state === 'on' ? 'var(--info-color)' : 'var(--disabled-text-color)';
                    ]]]
                - animation: |
                    [[[
                      return entity?.state === 'on' ? 'zehnder-pulse 1.8s ease-in-out infinite' : 'none';
                    ]]]
              name:
                - justify-self: start
                - align-self: end
                - font-size: 13px
                - color: var(--secondary-text-color)
                - letter-spacing: 0
              state:
                - justify-self: start
                - align-self: start
                - font-size: 14px
                - font-weight: 600
                - letter-spacing: 0
            extra_styles: |
              @keyframes zehnder-pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.12); opacity: 0.68; }
              }

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bypass_offnung
            name: Bypass
            icon: mdi:valve-open
            color: orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Luft und Temperatur
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_zuluftvolumenstrom
            name: Zuluft
            icon: mdi:weather-windy
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_abluftvolumenstrom
            name: Abluft
            icon: mdi:weather-windy
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_volumenstrom_abweichung
            name: Abweichung
            icon: mdi:scale-balance
            color: teal
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_leistungsaufnahme
            name: Leistung
            icon: mdi:flash
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_aussenlufttemperatur
            name: Außenluft
            icon: mdi:thermometer-low
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_zulufttemperatur
            name: Zuluft
            icon: mdi:home-import-outline
            color: blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_ablufttemperatur
            name: Abluft
            icon: mdi:home-export-outline
            color: orange
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_fortlufttemperatur
            name: Fortluft
            icon: mdi:thermometer-chevron-down
            color: deep-orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Effizienz und Wartung
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_warmeruckgewinnungsgrad
            name: Wärmerückgewinnung
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_kalteruckgewinnungsgrad
            name: Kälterückgewinnung
            icon: mdi:snowflake-thermometer
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_freie_kuhlung_begrundung
            name: Freie Kühlung
            icon: mdi:information-outline
            color: blue
            grid_options:
              columns: 12
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterrestlaufzeit
            name: Filterrestlaufzeit
            icon: mdi:calendar-clock
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_luftungsenergie_laufendes_jahr
            name: Energie im Jahr
            icon: mdi:counter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_eingesparte_heizenergie_gesamt
            name: Heizenergie zurückgewonnen
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 12
              rows: 2


  - title: Verlauf
    path: verlauf
    icon: mdi:chart-line
    show_icon_and_title: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Temperaturen · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_aussenlufttemperatur
                name: Außenluft
              - entity: sensor.zehnder_comfoair_q350_zulufttemperatur
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_ablufttemperatur
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_fortlufttemperatur
                name: Fortluft

      - type: grid
        title: Volumenstrom · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_zuluftvolumenstrom
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_abluftvolumenstrom
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_volumenstrom_abweichung
                name: Abweichung

      - type: grid
        title: Ventilatoren · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_zuluftventilator_ansteuerung
                name: Zuluft Ansteuerung
              - entity: sensor.zehnder_comfoair_q350_abluftventilator_ansteuerung
                name: Abluft Ansteuerung
              - entity: sensor.zehnder_comfoair_q350_zuluftventilator_drehzahl
                name: Zuluft Drehzahl
              - entity: sensor.zehnder_comfoair_q350_abluftventilator_drehzahl
                name: Abluft Drehzahl

      - type: grid
        title: Luftfeuchtigkeit · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_aussenluftfeuchtigkeit
                name: Außenluft
              - entity: sensor.zehnder_comfoair_q350_zuluftfeuchtigkeit
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_abluftfeuchtigkeit
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_fortluftfeuchtigkeit
                name: Fortluft

      - type: grid
        title: Energie
        cards:
          - type: entities
            entities:
              - sensor.zehnder_comfoair_q350_leistungsaufnahme
              - sensor.zehnder_comfoair_q350_luftungsenergie_laufendes_jahr
              - sensor.zehnder_comfoair_q350_luftungsenergie_gesamt
              - sensor.zehnder_comfoair_q350_eingesparte_heizleistung_thermisch
              - sensor.zehnder_comfoair_q350_eingesparte_kuhlleistung_thermisch

      - type: grid
        title: Anlagenzustand
        cards:
          - type: entities
            entities:
              - binary_sensor.zehnder_comfoair_q350_verbindung
              - sensor.zehnder_comfoair_q350_geratestatus
              - sensor.zehnder_comfoair_q350_betriebsmodus
              - sensor.zehnder_comfoair_q350_lufterstufe
              - sensor.zehnder_comfoair_q350_bypass_modus
              - sensor.zehnder_comfoair_q350_filterstatus
              - sensor.zehnder_comfoair_q350_filterrestlaufzeit
              - sensor.zehnder_comfoair_q350_bridge_gesundheit
