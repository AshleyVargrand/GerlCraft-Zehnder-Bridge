# Zehnder ComfoAir Bridge - einzelne native Ansicht
# Zum Einfuegen in ein bestehendes Home-Assistant-Dashboard.
# Diesen kompletten Block am Ende der vorhandenen views:-Liste einfuegen.

  - title: Zehnder
    path: zehnder
    icon: mdi:air-filter
    show_icon_and_title: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Anlage
        cards:
          - type: heading
            heading: Zehnder ComfoAir Q
            icon: mdi:fan
            grid_options:
              columns: 12
              rows: 1

          - type: tile
            entity: sensor.zehnder_comfoair_q350_lufterstufe
            name: Lüfterstufe
            icon: mdi:fan
            color: teal
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_betriebsmodus
            name: Betriebsmodus
            icon: mdi:auto-mode
            color: blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bridge_gesundheit
            name: Bridge
            icon: mdi:heart-pulse
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterstatus
            name: Filter
            icon: mdi:air-filter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: binary_sensor.zehnder_comfoair_q350_freie_kuhlung
            name: Freie Kühlung
            icon: mdi:snowflake-thermometer
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bypass_offnung
            name: Bypass
            icon: mdi:valve-open
            color: orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Luft und Temperatur
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_zuluftvolumenstrom
            name: Zuluft
            icon: mdi:weather-windy
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_abluftvolumenstrom
            name: Abluft
            icon: mdi:weather-windy
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_volumenstrom_abweichung
            name: Abweichung
            icon: mdi:scale-balance
            color: teal
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_leistungsaufnahme
            name: Leistung
            icon: mdi:flash
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_aussenlufttemperatur
            name: Außenluft
            icon: mdi:thermometer-low
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_zulufttemperatur
            name: Zuluft
            icon: mdi:home-import-outline
            color: blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_ablufttemperatur
            name: Abluft
            icon: mdi:home-export-outline
            color: orange
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_fortlufttemperatur
            name: Fortluft
            icon: mdi:thermometer-chevron-down
            color: deep-orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Effizienz und Wartung
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_warmeruckgewinnungsgrad
            name: Wärmerückgewinnung
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_kalteruckgewinnungsgrad
            name: Kälterückgewinnung
            icon: mdi:snowflake-thermometer
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_freie_kuhlung_begrundung
            name: Freie Kühlung
            icon: mdi:information-outline
            color: blue
            grid_options:
              columns: 12
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterrestlaufzeit
            name: Filterrestlaufzeit
            icon: mdi:calendar-clock
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_luftungsenergie_laufendes_jahr
            name: Energie im Jahr
            icon: mdi:counter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_eingesparte_heizenergie_gesamt
            name: Heizenergie zurückgewonnen
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 12
              rows: 2
