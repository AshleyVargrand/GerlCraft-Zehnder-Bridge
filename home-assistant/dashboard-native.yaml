# Zehnder ComfoAir Bridge - natives Home-Assistant-Dashboard
# Erwarteter Entity-Praefix: zehnder_comfoair_q350
# Keine benutzerdefinierten Karten erforderlich.

title: Zehnder ComfoAir
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:air-filter
    show_icon_and_title: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Anlage
        cards:
          - type: heading
            heading: Zehnder ComfoAir Q
            icon: mdi:fan
            grid_options:
              columns: 12
              rows: 1

          - type: tile
            entity: sensor.zehnder_comfoair_q350_lufterstufe
            name: Lüfterstufe
            icon: mdi:fan
            color: teal
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_betriebsmodus
            name: Betriebsmodus
            icon: mdi:auto-mode
            color: blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bridge_gesundheit
            name: Bridge
            icon: mdi:heart-pulse
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterstatus
            name: Filter
            icon: mdi:air-filter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: binary_sensor.zehnder_comfoair_q350_freie_kuhlung
            name: Freie Kühlung
            icon: mdi:snowflake-thermometer
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_bypass_offnung
            name: Bypass
            icon: mdi:valve-open
            color: orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Luft und Temperatur
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_zuluftvolumenstrom
            name: Zuluft
            icon: mdi:weather-windy
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_abluftvolumenstrom
            name: Abluft
            icon: mdi:weather-windy
            color: green
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_volumenstrom_abweichung
            name: Abweichung
            icon: mdi:scale-balance
            color: teal
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_leistungsaufnahme
            name: Leistung
            icon: mdi:flash
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_aussenlufttemperatur
            name: Außenluft
            icon: mdi:thermometer-low
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_zulufttemperatur
            name: Zuluft
            icon: mdi:home-import-outline
            color: blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_ablufttemperatur
            name: Abluft
            icon: mdi:home-export-outline
            color: orange
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_fortlufttemperatur
            name: Fortluft
            icon: mdi:thermometer-chevron-down
            color: deep-orange
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        title: Effizienz und Wartung
        cards:
          - type: tile
            entity: sensor.zehnder_comfoair_q350_warmeruckgewinnungsgrad
            name: Wärmerückgewinnung
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_kalteruckgewinnungsgrad
            name: Kälterückgewinnung
            icon: mdi:snowflake-thermometer
            color: light-blue
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_freie_kuhlung_begrundung
            name: Freie Kühlung
            icon: mdi:information-outline
            color: blue
            grid_options:
              columns: 12
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_filterrestlaufzeit
            name: Filterrestlaufzeit
            icon: mdi:calendar-clock
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_luftungsenergie_laufendes_jahr
            name: Energie im Jahr
            icon: mdi:counter
            color: amber
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: sensor.zehnder_comfoair_q350_eingesparte_heizenergie_gesamt
            name: Heizenergie zurückgewonnen
            icon: mdi:heat-wave
            color: red
            grid_options:
              columns: 12
              rows: 2


  - title: Verlauf
    path: verlauf
    icon: mdi:chart-line
    show_icon_and_title: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Temperaturen · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_aussenlufttemperatur
                name: Außenluft
              - entity: sensor.zehnder_comfoair_q350_zulufttemperatur
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_ablufttemperatur
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_fortlufttemperatur
                name: Fortluft

      - type: grid
        title: Volumenstrom · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_zuluftvolumenstrom
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_abluftvolumenstrom
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_volumenstrom_abweichung
                name: Abweichung

      - type: grid
        title: Ventilatoren · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_zuluftventilator_ansteuerung
                name: Zuluft Ansteuerung
              - entity: sensor.zehnder_comfoair_q350_abluftventilator_ansteuerung
                name: Abluft Ansteuerung
              - entity: sensor.zehnder_comfoair_q350_zuluftventilator_drehzahl
                name: Zuluft Drehzahl
              - entity: sensor.zehnder_comfoair_q350_abluftventilator_drehzahl
                name: Abluft Drehzahl

      - type: grid
        title: Luftfeuchtigkeit · 24 Stunden
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.zehnder_comfoair_q350_aussenluftfeuchtigkeit
                name: Außenluft
              - entity: sensor.zehnder_comfoair_q350_zuluftfeuchtigkeit
                name: Zuluft
              - entity: sensor.zehnder_comfoair_q350_abluftfeuchtigkeit
                name: Abluft
              - entity: sensor.zehnder_comfoair_q350_fortluftfeuchtigkeit
                name: Fortluft

      - type: grid
        title: Energie
        cards:
          - type: entities
            entities:
              - entity: sensor.zehnder_comfoair_q350_leistungsaufnahme
                name: Leistungsaufnahme
              - entity: sensor.zehnder_comfoair_q350_luftungsenergie_laufendes_jahr
                name: Lüftungsenergie dieses Jahr
              - entity: sensor.zehnder_comfoair_q350_luftungsenergie_gesamt
                name: Lüftungsenergie gesamt
              - entity: sensor.zehnder_comfoair_q350_eingesparte_heizleistung_thermisch
                name: Eingesparte Heizleistung
              - entity: sensor.zehnder_comfoair_q350_eingesparte_kuhlleistung_thermisch
                name: Eingesparte Kühlleistung

      - type: grid
        title: Anlagenzustand
        cards:
          - type: entities
            entities:
              - binary_sensor.zehnder_comfoair_q350_verbindung
              - sensor.zehnder_comfoair_q350_geratestatus
              - sensor.zehnder_comfoair_q350_betriebsmodus
              - sensor.zehnder_comfoair_q350_lufterstufe
              - sensor.zehnder_comfoair_q350_bypass_modus
              - sensor.zehnder_comfoair_q350_filterstatus
              - sensor.zehnder_comfoair_q350_filterrestlaufzeit
              - sensor.zehnder_comfoair_q350_bridge_gesundheit
