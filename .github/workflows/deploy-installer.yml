name: Browser-Installer veroeffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: PlatformIO installieren
        run: python -m pip install platformio==6.1.19

      - name: Repository pruefen
        run: python scripts/check_repository.py

      - name: Reproduzierbaren Zeitstempel setzen
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Firmware bauen und paketieren
        run: pio run -e atoms3-zehnder

      - name: Release-Paket pruefen
        run: python scripts/validate_release.py

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Installer-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/browser-installer

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
