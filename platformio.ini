[platformio]
default_envs = atoms3-zehnder

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

extra_scripts =
    post:scripts/package_release.py

monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 8MB
board_build.flash_size = 8MB

lib_deps =
    https://github.com/cyijun/ESP32MQTTClient.git#da1cc95608830b46520fe7e74eafce7de0158fa7

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DDEVICE_PROFILE_ZEHNDER=1

; Alte Quelldateien direkt unter src/ werden bewusst nicht gebaut.
build_src_filter =
    +<*>
    -<can_monitor.cpp>
    -<home_assistant_discovery.cpp>
    -<mqtt_manager.cpp>
    -<ota_manager.cpp>
    -<zehnder_decoder.cpp>
    -<zehnder_poller.cpp>

[env:atoms3-zehnder]

[env:atoms3-zehnder-ota]
extends = env:atoms3-zehnder

upload_protocol = espota
upload_port = 192.168.1.210

upload_flags =
    --port=3232
    --auth=${sysenv.GERLCRAFT_OTA_PASSWORD}
